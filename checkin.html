<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>当日チェックイン</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --line:#e5e7eb; --pri:#4f7cff; --pri2:#2dd4bf;
  --shadow:0 10px 26px rgba(15,23,42,.08);
  --radius:16px; --ok:#10b981;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#f6f7fb 0%, #eef2ff 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",system-ui,sans-serif;
}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
header{display:flex;gap:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:10px;font-size:12px}
.btn.ok{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.input{border:1px solid var(--line);padding:6px 10px;border-radius:10px}
.feeInput{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;text-align:right}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line)}
.badge.ok{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.main{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.bd{padding:12px 14px}
.pItem{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pLeft{min-width:220px}
.pName{font-weight:900}
.pMeta{font-size:12px;color:var(--muted)}
.pRight{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
</style>
</head>

<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>当日チェックイン</h1>
      <div style="font-size:12px;color:#6b7280">※ 参加確定者のみ表示</div>
    </div>
  </div>
</header>

<div class="main">

<section class="card">
  <div class="hd"><strong>イベント</strong></div>
  <div class="bd">
    <input type="date" class="input" id="evDate">
    <div style="height:8px"></div>
    <div id="evList"></div>
  </div>
</section>

<section class="card">
  <div class="hd">
    <strong id="evTitle">イベント未選択</strong>
    <div style="flex:1"></div>
    <span class="badge" id="sumAll">合計 ¥0</span>
    <span class="badge ok" id="sumIn">IN ¥0</span>
  </div>
  <div class="bd" id="pBody"></div>
</section>

</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyQkxsI-5zHH4f5BcFz_bkvDEdPwWF3stmmALEEYga8x0VrJBzcF8Fr61UjITWm0BK7/exec";
const ADMIN_KEY="kei591117";
const $=id=>document.getElementById(id);
const yen=n=>"¥"+Number(n||0).toLocaleString();

let events=[],participants=[],selectedDate=null;

function evDateStr(ev){
  const d=new Date(ev.date||ev.eventDate||ev.startDate);
  if(isNaN(d)) return "";
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function getFee(p){
  return Number(p.fee ?? p.price ?? p.amount ?? p["参加費"] ?? p["料金"] ?? 0);
}
function calcSum(){
  let all=0,inSum=0;
  participants.forEach(p=>{
    const f=getFee(p);
    all+=f;
    if(p.checkedIn) inSum+=f;
  });
  $("sumAll").textContent=`合計 ${yen(all)}`;
  $("sumIn").textContent=`IN ${yen(inSum)}`;
}

async function load(){
  const r=await fetch(API_URL+"?action=list").then(r=>r.json());
  events=r.events||[];
  renderEvents();
}
function renderEvents(){
  $("evList").innerHTML=events
    .filter(e=>!selectedDate || evDateStr(e)===selectedDate)
    .map(e=>`<div class="btn" onclick="selectEvent('${e.id}')">${e.title}</div>`)
    .join("");
}
$("evDate").onchange=()=>{selectedDate=$("evDate").value;renderEvents();};

window.selectEvent=async id=>{
  const r=await fetch(API_URL+`?action=participants:list&eventId=${id}`).then(r=>r.json());

  // ★ 確定者のみ ★
  participants=(r.participants||[]).filter(p=>{
    const s=String(p.status||p.state||"").toLowerCase();
    return s==="confirmed" || s==="確定" || s==="参加";
  });

  render();
};

function render(){
  $("pBody").innerHTML=participants.map(p=>`
    <div class="pItem">
      <div class="pLeft">
        <div class="pName">${p.name||""}</div>
        <div class="pMeta">${p.gender||""}</div>
      </div>
      <div class="pRight">
        <input class="feeInput" value="${getFee(p)}" oninput="updateFee('${p.pid}',this.value)">
        <button class="btn ok" onclick="toggleCheck('${p.pid}')">${p.checkedIn?"IN":"チェック"}</button>
      </div>
    </div>
  `).join("");
  calcSum();
}

window.updateFee=(pid,v)=>{
  const p=participants.find(x=>x.pid===pid);
  p.fee=Number(v||0);
  calcSum();
  fetch(API_URL,{method:"POST",body:JSON.stringify({action:"participants:setFee",key:ADMIN_KEY,pid,fee:p.fee})});
};
window.toggleCheck=pid=>{
  const p=participants.find(x=>x.pid===pid);
  p.checkedIn=!p.checkedIn;
  render();
  fetch(API_URL,{method:"POST",body:JSON.stringify({action:"participants:checkin",key:ADMIN_KEY,pid})});
};

load();
</script>
</body>
</html>
