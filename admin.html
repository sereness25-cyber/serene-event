<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>イベント管理</title>

<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --line:#e5e7eb; --pri:#4f7cff; --pri2:#2dd4bf;
  --shadow:0 10px 26px rgba(15,23,42,.08);
  --radius:16px; --danger:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#f6f7fb 0%, #eef2ff 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 40px}

header{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;padding-bottom:12px
}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:var(--shadow)}
h1{font-size:18px;margin:0}
.sub{font-size:12px;color:var(--muted)}

.btn{
  border:1px solid var(--line);background:#fff;
  padding:8px 12px;border-radius:999px;cursor:pointer;
  font-size:12px; text-decoration:none; color:inherit;
  display:inline-flex;align-items:center;gap:6px;
}
.btn.primary{
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  color:#fff;border:none;
}
.btn.danger{border-color:#fca5a5;color:#b91c1c}

.input{
  border:1px solid var(--line);
  padding:10px 12px;border-radius:999px;
  width:100%;
  font-size:13px;
  background:#fff;
}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bd{padding:12px 14px}
.meta{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:#b91c1c}
.list{display:flex;flex-direction:column;gap:10px}

.item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.item .title{font-weight:800}
.item .subline{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ✅ 折りたたみ（details/summary） */
.evItem{
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}
.evSum{
  cursor:pointer;
  list-style:none;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  padding:12px 14px;
}
.evSum::-webkit-details-marker{display:none;}
.evHead{min-width:260px;flex:1}
.evHead .title{font-weight:800}
.evHead .subline{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.evChevron{
  flex:0 0 auto;
  font-size:12px;
  color:var(--muted);
  user-select:none;
  transform-origin:center;
  transition:transform .15s ease;
  margin-top:2px;
}
details[open] .evChevron{transform:rotate(180deg);}
.evBody{
  padding:0 14px 12px;
}
.evBodyInner{
  padding-top:10px;
  border-top:1px dashed var(--line);
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.evBodyLeft{min-width:260px;flex:1}
.evBodyActions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}

/* ✅ 文字を見やすく整理（追記） */
.evMetaLine{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
  margin-top:6px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fafbff;
  color:#334155;
  font-size:12px;
  white-space:nowrap;
}
.badge.pri{ border-color:rgba(79,124,255,.25); background:rgba(79,124,255,.08); color:#1f3b8f; }
.badge.ok{ border-color:rgba(45,212,191,.35); background:rgba(45,212,191,.10); color:#0f766e; }

.evSections{ margin-top:10px; display:flex; flex-direction:column; gap:10px; }
.box{
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
}
.boxTitle{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  margin:0 0 6px 0;
  letter-spacing:.02em;
}
.boxText{
  font-size:13px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}
.kv{
  display:grid;
  grid-template-columns:88px 1fr;
  gap:6px 10px;
  font-size:13px;
  line-height:1.65;
}
.kv .k{ color:var(--muted); font-weight:700; }
.kv .v{ color:var(--text); }

.clamp{
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
details.longText summary{
  cursor:pointer;
  list-style:none;
  color:var(--pri);
  font-weight:800;
  font-size:12px;
  margin-top:6px;
}
details.longText summary::-webkit-details-marker{display:none;}

/* ✅ 中止イベント用（past.html でグレーアウトに使える） */
.evItem.canceled{
  opacity:.55;
  filter:grayscale(1);
}

/* モーダル */
.modalBack{
  position:fixed;inset:0;background:rgba(15,23,42,.35);
  display:none;align-items:center;justify-content:center;
  padding:18px; z-index:50;
}
.modal{
  width:min(860px,100%);
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);
}
.modalHd{
  padding:12px 14px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.modalHd strong{font-size:14px}
.modalBd{padding:12px 14px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
@media(max-width:900px){ .grid{grid-template-columns:1fr 1fr} }
@media(max-width:520px){ .grid{grid-template-columns:1fr} }
.fieldLabel{font-size:12px;color:var(--muted);margin:6px 0 6px}
.field{
  border:1px solid var(--line);
  padding:10px 12px;border-radius:12px;width:100%;
  font-size:13px;
}
textarea.field{border-radius:12px;min-height:78px;resize:vertical}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
/* ===== スマホ最適化：モーダルをスクロール可能に ===== */
@media (max-width: 640px) {

  .modalBack{
    align-items: flex-start; /* 上寄せ */
    padding: 12px;
  }

  .modal{
    max-height: 90vh;              /* 画面の90%まで */
    display: flex;
    flex-direction: column;
  }

  .modalBd{
    overflow-y: auto;              /* ★ここが重要（中身をスクロール） */
    -webkit-overflow-scrolling: touch;
  }

}

/* ===== スマホ：保存ボタン行を下に固定（見失わない） ===== */
@media (max-width: 640px) {
  /* modalBd の一番最後のdiv（保存/削除/ステータスの行）を sticky 化 */
  .modalBd > div:last-child{
    position: sticky;
    bottom: 0;
    background: #fff;
    padding-top: 10px;
    padding-bottom: 6px;
    border-top: 1px solid var(--line);
    z-index: 2;
  }
}
</style>
</head>

<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>イベント管理</h1>
      <div class="sub">共有DB（スプレッドシート）に保存されます</div>
    </div>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <a class="btn" id="linkPast" href="./past.html">過去イベント</a>
    <a class="btn" id="linkParticipants" href="./participants/participants.html">参加者管理</a>
    <a class="btn" id="linkCustomers" href="./customers/customers.html">顧客マスタ</a>

    <button class="btn" id="btnReload" type="button">更新</button>
    <button class="btn primary" id="btnNew" type="button">新規登録</button>

    <button class="btn" id="btnBackup" type="button">バックアップ</button>
    <button class="btn danger" id="btnRestore" type="button">復元</button>
  </div>
</header>

<section class="card">
  <div class="hd">
    <strong>登録済みイベント</strong>
    <span class="meta" id="count">-</span>
    <span class="meta" id="loadedAt">-</span>
  </div>
  <div class="bd">
    <input class="input" id="q" placeholder="検索（店名/Discord/恋活/概要…）">
  </div>
</section>

<section class="card" style="margin-top:14px">
  <div class="bd">
    <div class="list" id="list"></div>
    <div class="err" id="err" style="margin-top:10px"></div>
  </div>
</section>

<div class="modalBack" id="modalBack" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHd">
      <strong id="modalTitle">新規登録</strong>
      <button class="btn" id="btnClose" type="button">閉じる</button>
    </div>
    <div class="modalBd">
      <input type="hidden" id="eid">

      <div class="grid">

        <div>
          <div class="fieldLabel">タイトル（必須）</div>
          <input class="field" id="title" placeholder="例）恋活">
        </div>
        <div>
          <div class="fieldLabel">日付（必須）</div>
          <input class="field" id="date" type="date">
        </div>
        <div>
          <div class="fieldLabel">場所</div>
          <input class="field" id="place" placeholder="例）Yellow Flag">
        </div>

        <div>
          <div class="fieldLabel">開始</div>
          <input class="field" id="timeFrom" type="text" inputmode="numeric" placeholder="例）1330" autocomplete="off">
        </div>
        <div>
          <div class="fieldLabel">終了</div>
          <input class="field" id="timeTo" type="text" inputmode="numeric" placeholder="例）1430" autocomplete="off">
        </div>
        <div>
          <div class="fieldLabel">種別/タグ</div>
          <input class="field" id="note" placeholder="例）Discord / 恋活">
        </div>

        <div>
          <div class="fieldLabel">料金（男性）</div>
          <input class="field" id="priceM" inputmode="numeric" placeholder="例）1000">
        </div>
        <div>
          <div class="fieldLabel">料金（女性）</div>
          <input class="field" id="priceF" inputmode="numeric" placeholder="例）500">
        </div>

        <div style="grid-column:1 / -1">
          <div class="fieldLabel">概要</div>
          <textarea class="field" id="summary" placeholder="例）初参加歓迎。少人数でゆっくり会話。"></textarea>
        </div>

        <div>
          <div class="fieldLabel">〆切（任意）</div>
          <input class="field" id="deadline" type="date">
        </div>

        <div>
          <div class="fieldLabel">対象（例：独身限定 / 30-45歳 など）</div>
          <input class="field" id="target" placeholder="例）独身限定 / 30〜45歳 / 初参加歓迎">
        </div>

        <div>
          <div class="fieldLabel">支払方法</div>
          <input class="field" id="payMethod" placeholder="例）PayPay / 現金 / 事前決済 / 当日払い">
        </div>

        <div style="grid-column:1 / -1">
          <div class="fieldLabel">キャンセルについて</div>
          <textarea class="field" id="cancelPolicy" placeholder="例）前日まで無料／当日100%／連絡なし100% など"></textarea>
        </div>
      </div>

      <hr class="sep">

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn primary" id="btnSave" type="button">保存</button>
        <button class="btn danger" id="btnDelete" type="button" style="display:none">削除</button>
        <span class="meta" id="status">-</span>
      </div>
    </div>
  </div>
</div>

<div class="modalBack" id="restoreBack" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHd">
      <strong>バックアップから復元</strong>
      <button class="btn" id="btnRestoreClose" type="button">閉じる</button>
    </div>
    <div class="modalBd">
      <div class="meta" style="margin-bottom:10px">
        DriveのバックアップJSONの <b>fileId</b> を入れて復元します。<br>
        <span style="color:#b91c1c;font-weight:700">replace は全上書き</span> なので注意。
      </div>

      <div class="fieldLabel">Drive fileId（必須）</div>
      <input class="field" id="restoreFileId" placeholder="例）1AbcDEFgHiJkLmnOPq..." autocomplete="off">

      <div style="height:10px"></div>

      <div class="fieldLabel">復元モード</div>
      <select class="field" id="restoreMode">
        <option value="replace">replace（全上書き）</option>
        <option value="merge">merge（追記）</option>
      </select>

      <div style="height:10px"></div>

      <div class="fieldLabel">確認（RESTORE と入力）</div>
      <input class="field" id="restoreConfirm" placeholder="RESTORE" autocomplete="off">

      <hr class="sep">

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn danger" id="btnRestoreRun" type="button">復元を実行</button>
        <span class="meta" id="restoreStatus">-</span>
      </div>

      <div class="err" id="restoreErr" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<script>
/* ★あなたの /exec に固定 */
const API_URL = "https://script.google.com/macros/s/AKfycbyQkxsI-5zHH4f5BcFz_bkvDEdPwWF3stmmALEEYga8x0VrJBzcF8Fr61UjITWm0BK7/exec";
const $ = (id)=>document.getElementById(id);

let events = [];

function setError(msg){ $("err").textContent = msg || ""; }
function setStatus(msg){ $("status").textContent = msg || "-"; }

async function fetchJson(url, opt){
  const res = await fetch(url, Object.assign({cache:"no-store"}, opt||{}));
  const j = await res.json().catch(()=> ({}));
  if(j && j.ok === false && j.error) throw new Error(j.error);
  return j;
}

/* ===== API ===== */
async function apiList(){
  const j = await fetchJson(API_URL + "?action=list");
  return j.events || [];
}
async function apiBackupAll(note){
  const j = await fetchJson(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"backup:all", note: note || "" })
  });
  return j.backup;
}
async function apiRestoreAll(fileId, mode){
  const j = await fetchJson(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"restore:all", fileId, mode })
  });
  return j;
}
async function apiUpsert(ev){
  await fetchJson(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"upsert", event: ev })
  });
}
async function apiDelete(id){
  await fetchJson(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"delete", id })
  });
}

/* ✅ 中止判定（過去ページでも同じ関数を使える） */
function isCanceled(ev){
  return ev?.status === "canceled" || ev?.isCanceled === true || ev?.canceled === "1";
}

/* ===== 遷移（クリックでも確実に飛ばす） ===== */
function forceNavigate(href){
  try{ window.location.assign(href); }
  catch(_){ window.location.href = href; }
}
function bindNav(id, href){
  const el = $(id);
  if(!el) return;
  el.addEventListener("click",(e)=>{ e.preventDefault(); forceNavigate(href); });
  el.addEventListener("auxclick",()=>forceNavigate(href));
}
bindNav("linkPast","./past.html");
bindNav("linkParticipants","./participants/participants.html");
bindNav("linkCustomers","./customers/customers.html");

/* ===== 時刻入力：4桁→HH:mm に自動整形＋自動フォーカス移動 ===== */
function digitsOnly(s){ return String(s||"").replace(/[^\d]/g,""); }
function toHHMMFromDigits(d){
  const x = digitsOnly(d).slice(0,4);
  if(x.length <= 2) return x;
  return x.slice(0,2) + ":" + x.slice(2,4);
}
function setValueKeepCaret(el, newVal){
  const start = el.selectionStart ?? newVal.length;
  const before = el.value;
  el.value = newVal;
  const delta = newVal.length - before.length;
  const pos = Math.max(0, Math.min(newVal.length, start + delta));
  try{ el.setSelectionRange(pos, pos); }catch(_){}
}
function bindTimeSmart(fromId, toId){
  const from = document.getElementById(fromId);
  const to = document.getElementById(toId);

  function onInput(el, nextEl){
    const raw = el.value;
    const formatted = toHHMMFromDigits(raw);
    if(formatted !== raw){
      setValueKeepCaret(el, formatted);
    }
    const dig = digitsOnly(el.value);
    if(dig.length >= 4 && nextEl){
      nextEl.focus();
    }
  }

  from.addEventListener("input", ()=>onInput(from,to));
  to.addEventListener("input", ()=>onInput(to,null));

  function onBlur(el){
    const dig = digitsOnly(el.value);
    if(dig.length === 4){
      el.value = dig.slice(0,2) + ":" + dig.slice(2,4);
    }else if(dig.length === 0){
      el.value = "";
    }
  }
  from.addEventListener("blur", ()=>onBlur(from));
  to.addEventListener("blur", ()=>onBlur(to));
}
bindTimeSmart("timeFrom","timeTo");

function normalizeTimeField(id){
  const el = document.getElementById(id);
  const dig = digitsOnly(el.value);
  if(dig.length === 4) return dig.slice(0,2)+":"+dig.slice(2,4);
  const s = String(el.value||"").trim();
  if(/^\d{1,2}:\d{2}$/.test(s)){
    const [h,m]=s.split(":");
    return String(Number(h)).padStart(2,"0")+":"+m;
  }
  return s;
}

/* ✅ 並び替え用（開催日が近い順） */
function toDateSafe(dateStr, timeStr){
  if(!dateStr) return null;
  const s = String(dateStr).trim().replaceAll("/", "-");

  // timeStr が "10:00〜12:00" などでも先頭だけ拾う
  let t = (timeStr && String(timeStr).includes(":")) ? String(timeStr).trim() : "00:00";
  if(t.includes("〜") || t.includes("-") || t.includes("–")){
    const first = t.split("〜")[0].split("-")[0].split("–")[0].trim();
    if(first) t = first;
  }

  const d = new Date(`${s}T${t}:00`);
  if (isNaN(d.getTime())) return null;
  return d;
}
function sortBySoonest(a, b){
  const da = toDateSafe(a.date, (a.timeFrom||a.time||""));
  const db = toDateSafe(b.date, (b.timeFrom||b.time||""));
  if(!da && !db) return 0;
  if(!da) return 1;
  if(!db) return -1;
  const diff = da - db;
  if(diff !== 0) return diff;
  return String(a.title||"").localeCompare(String(b.title||""));
}

/* ===== UI ===== */
function openModal(mode, ev){
  $("modalBack").style.display="flex";
  $("modalBack").setAttribute("aria-hidden","false");
  setStatus("-"); setError("");

  if(mode==="new"){
    $("modalTitle").textContent="新規登録";
    $("eid").value="";
    $("title").value="";
    $("date").value="";
    $("timeFrom").value="";
    $("timeTo").value="";
    $("place").value="";
    $("priceM").value="";
    $("priceF").value="";
    $("note").value="";
    $("summary").value="";
    $("deadline").value="";
    $("target").value="";
    $("payMethod").value="";
    $("cancelPolicy").value="";
    $("btnDelete").style.display="none";
  }else{
    $("modalTitle").textContent="編集";
    $("eid").value=ev.id||"";
    $("title").value=ev.title||"";
    $("date").value=toDateValue(ev.date);

    const t = String(ev.time||"");
    const m = t.match(/(\d{1,2}:\d{2})\s*[〜\-–]\s*(\d{1,2}:\d{2})/);

    $("timeFrom").value = (ev.timeFrom || (m ? m[1] : "")) || "";
    $("timeTo").value   = (ev.timeTo   || (m ? m[2] : "")) || "";
    $("place").value=ev.place||"";
    $("priceM").value=ev.priceM||"";
    $("priceF").value=ev.priceF||"";
    $("note").value=ev.note||"";
    $("summary").value = ev.summary || ev.memo || "";
    $("deadline").value = toDateValue(ev.deadline);
    $("target").value = ev.target || "";
    $("payMethod").value = ev.payMethod || ev.pay || "";
    $("cancelPolicy").value = ev.cancelPolicy || "";

    $("btnDelete").style.display="inline-flex";
  }
}
function closeModal(){
  $("modalBack").style.display="none";
  $("modalBack").setAttribute("aria-hidden","true");
}
$("btnClose").onclick = closeModal;
$("modalBack").addEventListener("click",(e)=>{
  if(e.target === $("modalBack")) closeModal();
});

$("btnNew").onclick = ()=> openModal("new");
$("btnReload").onclick = ()=> location.reload();

/* ===== バックアップ / 復元 ===== */
function setRestoreError(msg){ $("restoreErr").textContent = msg || ""; }
function setRestoreStatus(msg){ $("restoreStatus").textContent = msg || "-"; }

function openRestoreModal(){
  $("restoreBack").style.display="flex";
  $("restoreBack").setAttribute("aria-hidden","false");
  $("restoreFileId").value = "";
  $("restoreMode").value = "replace";
  $("restoreConfirm").value = "";
  setRestoreStatus("-");
  setRestoreError("");
}
function closeRestoreModal(){
  $("restoreBack").style.display="none";
  $("restoreBack").setAttribute("aria-hidden","true");
}

function toDateValue(v){
  if(!v) return "";
  try{
    const d = (v instanceof Date) ? v : new Date(v);
    if(Number.isNaN(d.getTime())) return "";
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${dd}`;
  }catch(e){ return ""; }
}
function fmtDateJa(v){
  if(!v) return "-";
  const d = (v instanceof Date) ? v : new Date(v);
  if(Number.isNaN(d.getTime())) return String(v);
  const y=d.getFullYear(), m=d.getMonth()+1, dd=d.getDate();
  return `${y}年${m}月${dd}日`;
}
function fmtMoney(v){ return (v===0 || v==="0" || v) ? String(v) : "-"; }

const AUTO_OPEN_SOON_EVENTS = true;
const AUTO_OPEN_SOON_DAYS = 7; 

function isSoonEvent(ev){
  const d = toDateSafe(ev.date, ev.timeFrom || ev.time || "");
  if(!d) return false;
  const now = new Date();
  const diffDays = (d - now) / (1000*60*60*24);
  return diffDays >= -1 && diffDays <= AUTO_OPEN_SOON_DAYS;
}

function render(){
  const q = $("q").value.trim();

  const sorted = [...events].sort(sortBySoonest);
  const currentOnly = sorted.filter(e => !isCanceled(e));

  const list = q
    ? currentOnly.filter(e=>{
        const s = `${e.title||""} ${e.place||""} ${e.note||""} ${e.summary||e.memo||""} ${e.target||""} ${e.payMethod||e.pay||""} ${e.deadline||""} ${e.cancelPolicy||""}`.toLowerCase();
        return s.includes(q.toLowerCase());
      })
    : currentOnly;

  const displayLimit = 50; 
  const displayList = list.slice(0, displayLimit);

  $("count").textContent = `表示 ${displayList.length}件 / 検索ヒット ${list.length}件 / 全${events.length}件`;

  if(!displayList.length){
    $("list").innerHTML = `<div class="meta" style="padding:20px; text-align:center;">イベントがありません</div>`;
    return;
  }

  let html = displayList.map(e=>{
    const payTxt = e.payMethod || e.pay || "";
    const targetTxt = e.target || "";
    const cancelTxt = e.cancelPolicy || "";
    const deadlineTxt = e.deadline ? fmtDateJa(e.deadline) : "";
    const summaryTxt = String(e.summary || e.memo || "").trim();

    const openAttr = (AUTO_OPEN_SOON_EVENTS && isSoonEvent(e)) ? " open" : "";
    const isLong = summaryTxt.length > 140 || summaryTxt.split("\n").length >= 4;

    return `
    <details class="evItem"${openAttr}>
      <summary class="evSum">
        <div class="evHead">
          <div class="title">${escapeHtml(fmtDateJa(e.date))}｜${escapeHtml(e.title||"-")}</div>

          <div class="evMetaLine">
            <span class="badge pri">🕒 ${escapeHtml(e.timeFrom||"-")}〜${escapeHtml(e.timeTo||"-")}</span>
            <span class="badge">💰 男 ${escapeHtml(fmtMoney(e.priceM))} / 女 ${escapeHtml(fmtMoney(e.priceF))}</span>
            ${e.place ? `<span class="badge ok">📍 ${escapeHtml(e.place)}</span>` : ``}
            ${e.note ? `<span class="badge">🏷️ ${escapeHtml(e.note)}</span>` : ``}
          </div>
        </div>
        <div class="evChevron">▼</div>
      </summary>

      <div class="evBody">
        <div class="evBodyInner">
          <div class="evBodyLeft">

            <div class="evSections">
              <div class="box">
                <p class="boxTitle">概要</p>
                ${
                  !summaryTxt
                    ? `<div class="boxText" style="color:var(--muted)">未設定</div>`
                    : (
                        !isLong
                          ? `<div class="boxText">${escapeHtml(summaryTxt)}</div>`
                          : `
                            <div class="boxText clamp">${escapeHtml(summaryTxt)}</div>
                            <details class="longText">
                              <summary>全文を表示</summary>
                              <div class="boxText" style="margin-top:8px">${escapeHtml(summaryTxt)}</div>
                            </details>
                          `
                      )
                }
              </div>

              <div class="box">
                <p class="boxTitle">条件</p>
                <div class="kv">
                  ${deadlineTxt ? `<div class="k">〆切</div><div class="v">${escapeHtml(deadlineTxt)}</div>` : ``}
                  ${targetTxt ? `<div class="k">対象</div><div class="v">${escapeHtml(targetTxt)}</div>` : ``}
                  ${payTxt ? `<div class="k">支払</div><div class="v">${escapeHtml(payTxt)}</div>` : ``}
                  ${cancelTxt ? `<div class="k">キャンセル</div><div class="v">${escapeHtml(cancelTxt)}</div>` : ``}
                  ${(!deadlineTxt && !targetTxt && !payTxt && !cancelTxt) ? `<div class="v" style="grid-column:1/-1;color:var(--muted)">未設定</div>` : ``}
                </div>
              </div>
            </div>

          </div>

          <div class="evBodyActions">
            <button class="btn" data-edit="${escapeHtml(e.id)}" type="button">編集</button>
            <button class="btn" data-copy="${escapeHtml(e.id)}" type="button">コピー</button>
            <button class="btn danger" data-cancel="${escapeHtml(e.id)}" type="button">中止</button>
          </div>
        </div>
      </div>
    </details>
    `;
  }).join("");

  if (list.length > displayLimit) {
    html += `<div class="meta" style="text-align:center; padding:16px 0;">他 ${list.length - displayLimit} 件のイベントがあります。上の検索バーから絞り込んでください。</div>`;
  }

  $("list").innerHTML = html;

  document.querySelectorAll("[data-edit]").forEach(b=>{
    b.onclick = ()=>{
      const ev = events.find(x=>String(x.id)===String(b.dataset.edit));
      if(ev) openModal("edit", ev);
    };
  });

  document.querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick = ()=>{
      const ev = events.find(x=>String(x.id)===String(b.dataset.copy));
      if(!ev) return;
      openModal("new");
      $("title").value = ev.title||"";
      $("date").value = toDateValue(ev.date);
      $("timeFrom").value = ev.timeFrom||"";
      $("timeTo").value = ev.timeTo||"";
      $("place").value = ev.place||"";
      $("priceM").value = ev.priceM||"";
      $("priceF").value = ev.priceF||"";
      $("note").value = ev.note||"";

      $("summary").value = ev.summary || ev.memo || "";

      $("deadline").value = toDateValue(ev.deadline);
      $("target").value = ev.target || "";
      $("payMethod").value = ev.payMethod || ev.pay || "";
      $("cancelPolicy").value = ev.cancelPolicy || "";
    };
  });

  document.querySelectorAll("[data-cancel]").forEach(b=>{
    b.onclick = async ()=>{
      const ev = events.find(x=>String(x.id)===String(b.dataset.cancel));
      if(!ev) return;

      if(!confirm(
        "このイベントを中止します。\n" +
        "中止すると通常一覧から消え、過去イベントに移動します。\n\n" +
        "実行しますか？"
      )) return;

      try{
        setError("");
        await apiUpsert({ ...ev, status: "canceled" });
        await refreshList(); 
        alert("イベントを中止しました");
      }catch(err){
        setError("中止に失敗：" + (err.message || err));
      }
    };
  });

}

/* ===== 保存/削除（保存後に必ず list 再取得） ===== */
const CACHE_KEY = "events_local_cache_v3";

async function refreshList(isBackground = false){
  try {
    const freshEvents = await apiList();
    freshEvents.sort(sortBySoonest);

    const oldDataStr = JSON.stringify(events);
    const newDataStr = JSON.stringify(freshEvents);

    // ★データが本当に変わっていた時だけ、しれっと画面を更新する
    if (oldDataStr !== newDataStr) {
      events = freshEvents;
      try { localStorage.setItem(CACHE_KEY, newDataStr); } catch(e){}
      render();
    }
    
    // こっそり「最終同期時間」だけ更新（通信中などの文字は一切出さない）
    const time = new Date().toLocaleTimeString("ja-JP", {hour: '2-digit', minute:'2-digit'});
    $("loadedAt").textContent = `自動同期済 (${time})`;

  } catch(err) {
    if(!isBackground) setError("通信エラー： " + (err.message || err));
  }
}

function escapeHtml(s){
  return String(s??"")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

/* ===== 起動（無音・完全ステルスロード） ===== */
(async()=>{
  try {
    setError("");
    const cached = localStorage.getItem(CACHE_KEY);
    
    if (cached) {
      // 記憶があれば一瞬で画面を描画して、ロード中アピールを一切しない
      events = JSON.parse(cached);
      render(); 
    } else {
      // 記憶がない初めて開く時だけメッセージを出す
      $("list").innerHTML = `<div style="padding:40px; text-align:center; color:var(--muted)">データを同期しています...</div>`;
    }

    // 裏側で完全に無音で通信を開始（画面はフリーズしない）
    setTimeout(() => {
      refreshList(true).catch(err => {
         if(!cached) setError("通信エラー： " + (err.message || err));
      });
    }, 50);

  } catch(err) {
    setError("起動エラー： " + (err.message || err));
  }
})();
</script>
